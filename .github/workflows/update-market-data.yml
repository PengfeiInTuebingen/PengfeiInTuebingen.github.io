name: Update market data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-market.txt

      - name: Install pinned workbook parser
        run: python -m pip install --require-hashes -r scripts/requirements-market.txt

      - name: Download and validate public market data
        env:
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
        run: python scripts/update_market_data.py

      - name: Detect data changes
        id: changes
        run: |
          if git diff --quiet -- markets/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed JSON
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add markets/data/latest.json markets/data/history.json
          git commit -m "data: refresh market dashboard"
          git push origin gh-pages

      - name: Write run summary
        run: |
          echo "## Market data update" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target cadence: **every 15 minutes** (GitHub Actions best effort)" >> "$GITHUB_STEP_SUMMARY"
          echo "- AI tokens used: **0**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Data bundle: \`markets/data/latest.json\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Changed: **${{ steps.changes.outputs.changed }}**" >> "$GITHUB_STEP_SUMMARY"
